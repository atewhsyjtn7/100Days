<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Example</title>
    <style>
        table {
            width: 50%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<h2>Student Information</h2>

<table>
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Grade</th>
    </tr>
    <tr>
        <td>Robin</td>
        <td>18</td>
        <td>11</td>
    </tr>
    <tr>
        <td>Joshua</td>
        <td>16</td>
        <td>11</td>
    </tr>
    <tr>
        <td>Maxine</td>
        <td>17</td>
        <td>11</td>
    </tr>
</table>

</body>
</html>
